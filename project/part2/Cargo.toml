[package]
edition      = "2024"
name         = "no_std-training"
rust-version = "1.95"
version      = "0.1.0"

[dependencies]
embassy-executor = "0.10.0"
# ANCHOR: embassy_net
embassy-net = { version = "0.9.1", features = [
  "dhcpv4",
  "dns",
  "medium-ethernet",
  "tcp",
  "udp",
] }
# ANCHOR_END: embassy_net
embassy-time = "0.5.1"
embedded-io-async = "0.7.0"
# ANCHOR: esp_alloc
esp-alloc = { version = "0.11.0", features = ["esp32c3"] }
# ANCHOR_END: esp_alloc
esp-backtrace = { version = "0.20.0", features = [
  "esp32c3",
  "panic-handler",
  "println",
] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32c3", "log-04"] }
esp-hal = { version = "1.2.2", features = ["esp32c3", "log-04", "unstable"] }
esp-println = { version = "0.18.0", features = ["esp32c3", "log-04"] }
# ANCHOR: esp_radio
esp-radio = { version = "1.0.0-beta.1", features = ["esp32c3", "log-04", "wifi"] }
# ANCHOR_END: esp_radio
# ANCHOR: esp_rtos
esp-rtos = { version = "0.4.0", features = [
  "embassy",
  "esp-alloc",
  "esp-radio",
  "esp32c3",
  "log-04",
] }
# ANCHOR_END: esp_rtos
log = "0.4.35"
shtcx2 = { version = "0.1.0", features = ["async"] }
# ANCHOR: static_cell
static_cell = "2.1.1"
# ANCHOR_END: static_cell

[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2
lto           = 'fat'
opt-level     = 's'
