[package]
edition      = "2024"
name         = "no_std-training"
rust-version = "1.95"
version      = "0.1.0"

[dependencies]
# ANCHOR: edge_net
edge-captive = { version = "0.8.0", default-features = false, features = [
  "io",
] }
edge-dhcp = "0.8.0"
edge-http = { version = "0.8.0", default-features = false, features = [
  "edge-nal",
  "embedded-io-async",
  "io",
] }
edge-nal = "0.7.0"
edge-nal-embassy = "0.9.0"
# ANCHOR_END: edge_net
embassy-executor = "0.10.0"
embassy-net = { version = "0.9.1", features = [
  "dhcpv4",
  "dns",
  "medium-ethernet",
  "tcp",
  "udp",
] }
embassy-sync = "0.8.0"
embassy-time = "0.5.1"
embedded-io-async = "0.7.0"
esp-alloc = { version = "0.11.0", features = ["esp32c3"] }
esp-backtrace = { version = "0.20.0", features = [
  "esp32c3",
  "panic-handler",
  "println",
] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32c3", "log-04"] }
esp-hal = { version = "1.2.2", features = ["esp32c3", "log-04", "unstable"] }
esp-println = { version = "0.18.0", features = ["esp32c3", "log-04"] }
esp-radio = { version = "1.0.0-beta.1", features = ["esp32c3", "log-04", "wifi"] }
esp-rtos = { version = "0.4.0", features = [
  "embassy",
  "esp-alloc",
  "esp-radio",
  "esp32c3",
  "log-04",
] }
heapless = { version = "0.9.3", features = ["serde"] }
log = "0.4.35"
rust-mqtt = { version = "0.6.0", default-features = false, features = ["bump", "v5"] }
serde = { version = "1.0.228", default-features = false, features = ["derive"] }
serde-json-core = "0.7.0"
shtcx2 = { version = "0.1.0", features = ["async"] }
static_cell = "2.1.1"

[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2
lto           = 'fat'
opt-level     = 's'
