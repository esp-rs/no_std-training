[package]
edition      = "2024"
name         = "no_std-training"
rust-version = "1.95"
version      = "0.1.0"

[dependencies]
embassy-executor = "0.10.0"
embassy-time = "0.5.1"
esp-backtrace = { version = "0.20.0", features = [
  "esp32c3",
  "panic-handler",
  "println",
] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32c3", "log-04"] }
esp-hal = { version = "1.2.2", features = ["esp32c3", "log-04", "unstable"] }
esp-println = { version = "0.18.0", features = ["esp32c3", "log-04"] }
esp-rtos = { version = "0.4.0", features = ["embassy", "esp32c3", "log-04"] }
log = "0.4.35"
shtcx2 = { version = "0.1.0", features = ["async"] }

[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2
lto           = 'fat'
opt-level     = 's'
