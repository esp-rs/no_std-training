name: Book CI

on:
  push:
    branches:
      - main
    paths:
      - "training/**"
      # Chapters include snippets from the project sources.
      - "project/**"
      - "book.toml"
      - "lychee.toml"
      - "mermaid-init.js"
      - "mermaid.min.js"
      - ".github/workflows/book.yml"
  pull_request:
    paths:
      - "training/**"
      # Chapters include snippets from the project sources.
      - "project/**"
      - "book.toml"
      - "lychee.toml"
      - "mermaid-init.js"
      - "mermaid.min.js"
      - ".github/workflows/book.yml"
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7

      - uses: jontze/action-mdbook@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          mdbook-version: "0.5.4"
          use-mermaid: true
          mermaid-version: "0.17.1"

      - name: Install shiftinclude preprocessor
        run: cargo install mdbook-shiftinclude --locked

      - name: Build the contents of the book
        run: mdbook build -d output

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --config lychee.toml output
          fail: true

      - name: Deploy
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        uses: appleboy/scp-action@v1.0.0
        with:
          host: docs.espressif.com
          username: ${{ secrets.PRODUCTION_USERNAME }}
          key: ${{ secrets.PRODUCTION_KEY }}
          target: ${{ secrets.PRODUCTION_TARGET }}
          source: "output/"
          strip_components: 1 # remove the prefix, it's already being placed in /projects/rust/no_std-training
          overwrite: true
          rm: true # remove pages that are no longer part of the book
