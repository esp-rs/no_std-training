name: AI Docs Review

on:
  pull_request:
    paths:
      - "training/*.md"
      - "training/**/*.md"
      - "book.toml"
      - "Cargo.lock"
      - "Cargo.toml"
      - ".github/doc-style-guide.md"
      - ".github/workflows/ai-docs-review.yml"
      - "xtask/**"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Review documentation consistency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Run documentation review
        run: cargo ai-doc-review
        env:
          # This token is used only for the GitHub Models inference API, not for
          # submitting a pull request review. The built-in workflow token cannot
          # access GitHub Models in this repository, so configure a separate token
          # to enable the AI pass in CI.
          AI_DOC_REVIEW_API_KEY: ${{ secrets.AI_DOC_REVIEW_API_KEY }}
          AI_DOC_REVIEW_BASE_URL: https://models.github.ai/inference
          AI_DOC_REVIEW_MODEL: ${{ vars.AI_DOC_REVIEW_MODEL || 'openai/gpt-4.1-mini' }}
          DOC_REVIEW_GITHUB_TOKEN: ${{ github.token }}
          DOC_REVIEW_FAIL_ON_ERROR: "true"
          # Set to "true" to review all Markdown files instead of only PR changed lines.
          DOC_REVIEW_CHECK_ALL: ${{ vars.DOC_REVIEW_CHECK_ALL || 'false' }}

      - name: Upload documentation review report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: documentation-review-report
          path: |
            doc-review-report.json
            doc-review-summary.md
          if-no-files-found: ignore
