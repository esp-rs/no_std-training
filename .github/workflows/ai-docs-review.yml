name: AI Docs Review

on:
  pull_request:
    paths:
      - "training/*.md"
      - "training/**/*.md"
      - "book.toml"
      - ".github/doc-style-guide.md"
      - ".github/doc-terms.json"
      - ".github/workflows/ai-docs-review.yml"
      - "tools/ai-doc-review/**"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  models: read

jobs:
  review:
    name: Review documentation consistency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Run documentation review
        run: node tools/ai-doc-review/review.mjs
        env:
          # Use GitHub Models with the workflow token, so no OpenAI secret is required.
          GITHUB_TOKEN: ${{ github.token }}
          AI_DOC_REVIEW_BASE_URL: https://models.github.ai/inference
          AI_DOC_REVIEW_MODEL: ${{ vars.AI_DOC_REVIEW_MODEL || 'openai/gpt-4.1-mini' }}
          DOC_REVIEW_FAIL_ON_ERROR: "true"

      - name: Upload documentation review report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: documentation-review-report
          path: |
            doc-review-report.json
            doc-review-summary.md
          if-no-files-found: ignore
